[package]
name = "mock-signer"
version = "0.1.0"
edition = "2024"
publish = false
description = "Sandbox stand-in for NEAR's Chain Signatures contract (v1.signer): same interface and key derivation, one fixed test key. Never deploy outside a sandbox."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.24"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
sha3 = { version = "0.10", default-features = false }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.24", features = ["unit-testing"] }
