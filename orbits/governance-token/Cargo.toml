[package]
name = "governance-token"
version = "0.1.0"
edition = "2024"
publish = false
description = "The NEP-141 token of an Orbits DAO: an initial supply, a cap on everything ever minted, and minting only by the DAO"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.24"
near-contract-standards = "5.24"

[dev-dependencies]
near-sdk = { version = "5.24", features = ["unit-testing"] }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.19.0-rust-1.86.0"
image_digest = "sha256:772638e343baeeea24e49062c7d424274f3441452cc06ce97fc4e5695b19fecc"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
